<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TireDrop — Tires Shipped Free. Or Installed For You.</title>
    <meta
      name="description"
      content="Shop tires and wheels from Continental, Michelin, Bridgestone, Pirelli and more. Shipped free to the 48 contiguous states and DC, or delivered free to our Sunrise, FL shop and installed for you."
    />
    <meta name="theme-color" content="#070E1A" />
    <!-- Google Analytics 4 (property "Tire Drop", stream G-2MCPDH5WF9).
         Route changes are counted by GA4 enhanced measurement ("page changes
         based on browser history events"), so no router code is needed.
         Google signals and ad personalization are switched off here, which is
         what lets the privacy policy say the data is not used for advertising.
         Privacy §§3, 4 and 6 describe this tag — change them if it changes. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-2MCPDH5WF9"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag("js", new Date());
      gtag("config", "G-2MCPDH5WF9", {
        allow_google_signals: false,
        allow_ad_personalization_signals: false,
      });
    </script>
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <!-- Safari on iOS ignores the SVG favicon, and an SVG cannot be used as a
         home-screen icon at all, so this is a flat 180x180 PNG on brand ink. -->
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="TireDrop" />
    <meta
      property="og:title"
      content="TireDrop — Tires Shipped. Or Installed."
    />
    <meta
      property="og:description"
      content="A full tire and wheel catalog shipped to your door, or installed at our shop in Sunrise, FL. Powered by Extreme Tires."
    />
    <meta property="og:type" content="website" />
    <!-- A flat card on brand ink. The logo itself is a transparent PNG, and a
         transparent image composites onto whatever colour the platform picks. -->
    <meta
      property="og:image"
      content="https://tiredroponline.com/brand/og-tiredrop.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://tiredroponline.com/brand/og-tiredrop.jpg"
    />
    <meta property="og:url" content="https://tiredroponline.com/" />
    <meta property="og:site_name" content="TireDrop" />
    <meta property="og:locale" content="en_US" />
    <!-- Twitter falls back to og:title / og:description when these are absent,
         but Slack and a few others do not, so both pairs are spelled out. -->
    <meta
      name="twitter:title"
      content="TireDrop — Tires Shipped. Or Installed."
    />
    <meta
      name="twitter:description"
      content="A full tire and wheel catalog shipped to your door, or installed at our shop in Sunrise, FL. Powered by Extreme Tires."
    />
    <!-- No canonical here on purpose. This file is the template every route
         is prerendered from (scripts/prerender.mjs), which removes this
         comment and the title, description, og:title/description/type/url
         and twitter:title/description above, and writes each route's own
         set, canonical, robots and JSON-LD in their place. Unprerendered, as
         in `vite dev` and dist/spa.html, the Seo component sets them once
         React renders. A static canonical here would call every URL a
         duplicate of the home page. -->
    <!-- Fonts are self-hosted: the @font-face rules are in src/index.css and
         Vite fingerprints the files into /assets/. Deliberately NOT preloaded:
         in the lab (4x CPU, slow 4G) preloading both roman files delayed LCP by
         about 100 ms, because they compete with the render-blocking CSS and JS;
         the size-adjusted fallback faces keep the swap from shifting the layout
         (CLS 0). -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
